        </div>
      ))}
    </div>
  );
};

const ExamRow = ({ sub, exam, sd, isTeacher, capture, onScore, onTarget, onExpPerf }) => {
  const skipped = !takes(exam.id, sub.name);
  const d = sd?.[exam.id];
  const score = toS(d?.scores?.[sub.name]);
  const target = toS(d?.plan?.targets?.[sub.name]);
  const expStored = d?.plan?.expectedPerf?.[sub.name];
  const expPerf = isNum(expStored) ? clamp(Math.round(Number(expStored)), 0, sub.rp) : sub.rp;
  const st = semesterStatus(sub, exam.sem, sd);
  return (
    <tr className={`border-b border-gray-100 ${skipped ? "bg-gray-100/50" : "hover:bg-gray-50"}`}>
      <td className="p-2 font-bold text-gray-800 text-center bg-gray-50 border-r border-gray-100 text-sm whitespace-nowrap">{sub.name}</td>
      {skipped ? (
        <td colSpan={6} className="p-2 text-center text-gray-400 text-xs font-bold">이번 시험 미실시 과목</td>
      ) : (
        <>
          <td className="p-1 border-r border-gray-100"><div className="flex justify-center"><NumInput s={target} onCommit={onTarget} placeholder="목표" capture={capture} tone="text-emerald-700" /></div></td>
          <td className="p-1 border-r border-gray-100"><div className="flex justify-center"><NumInput s={score} onCommit={onScore} disabled={!isTeacher} placeholder={isTeacher ? "점수" : "-"} capture={capture} /></div></td>
          <td className="p-1 text-center text-sm"><Delta d={score !== null && target !== null ? score - target : null} /></td>
          <td className="p-1 text-center text-sm border-r border-gray-100"><DeltaCell info={deltaInfo(sd, exam.id, sub.name)} /></td>
          <td className="p-1 text-center border-r border-gray-100"><GradeBadge g={score !== null ? gradeOfS(score, sub.name) : null} /></td>
          <td className="p-1 text-center align-middle bg-yellow-50">
            <ProjectionCell proj={projectionFor(exam.kind, sub, st.e1, st.e2, expPerf)} subj={sub.name}
              showPerfSelect={exam.kind === "e1" && sub.r1 > 0 && sub.r2 > 0} expPerf={expPerf} rp={sub.rp} capture={capture} onExpPerf={onExpPerf} />
          </td>
        </>
      )}
    </tr>
  );
};

const SemesterRow = ({ sub, exam, sd, isTeacher, capture, onE1, onE2, onPerf, showDelta }) => {
  const st = semesterStatus(sub, exam.sem, sd);
  const cell = (ratio, s, max, ph, onCommit) => ratio === 0
    ? <div className="w-14 py-1 text-center text-gray-300 text-xs font-semibold">-</div>
    : <NumInput s={s} max={max} disabled={!isTeacher} placeholder={ph} capture={capture} onCommit={onCommit} />;
  return (
    <tr className="border-b border-gray-100 hover:bg-gray-50">
      <td className="p-2 font-bold text-gray-800 text-center bg-purple-50 border-r border-gray-100 text-sm whitespace-nowrap">{sub.name}</td>
      <td className="p-1 border-r border-gray-100 text-center text-xs font-semibold">
        <span className={sub.r1 ? "text-purple-700" : "text-gray-300"}>{sub.r1}</span>:<span className={sub.r2 ? "text-purple-700" : "text-gray-300"}>{sub.r2}</span>:<span className={sub.rp ? "text-purple-700" : "text-gray-300"}>{sub.rp}</span>
      </td>
      <td className="p-1 border-r border-gray-100">
        <div className="flex justify-center gap-1">
          {cell(sub.r1, st.e1, 100, "1차", onE1)}
          {cell(sub.r2, st.e2, 100, "2차", onE2)}
          {cell(sub.rp, st.perf, sub.rp, "수행", onPerf)}
        </div>
      </td>
      <td className="p-1 text-center font-bold text-purple-700 text-sm bg-purple-50">
        {!st.any ? <span className="text-gray-400">-</span>
          : st.complete ? <div>{st.points}점{st.U % UNIT !== 0 && <div className="text-[10px] text-purple-400 font-semibold">({fmtScaled(st.U, DEC + 2)})</div>}</div>
          : <div className="text-gray-400 text-xs leading-tight">입력 중<br/>(현재 {fmtScaled(st.U, DEC + 2)})</div>}
      </td>
      <td className="p-1 text-center bg-purple-50"><GradeBadge g={st.grade} purple /></td>
      {showDelta && <td className="p-1 text-center text-sm bg-purple-50"><DeltaCell info={deltaInfo(sd, exam.id, sub.name)} /></td>}
    </tr>
  );
};

/* ═════════════════════════ 8. 개인 분석 (학생·선생님 공용) ═════════════════════════ */
const MyAnalysis = ({ sd, exam }) => {
  const subs = examSubjects(exam);
  const sum = studentSummary(sd, exam.id);
  const withDelta = subs.filter((s) => sum.deltas[s.name] !== null);
  const best = withDelta.length ? withDelta.reduce((a, b) => (sum.deltas[b.name] > sum.deltas[a.name] ? b : a)) : null;
  const worst = withDelta.length ? withDelta.reduce((a, b) => (sum.deltas[b.name] < sum.deltas[a.name] ? b : a)) : null;
  const seq = exam.kind === "final" ? SEQ.f : SEQ.e;
  const lineSubs = SUBJECTS[2].map((s) => s.name).filter((name) => seq.some((id) => valueS(sd, id, name) !== null));
  if (!sum.n && !lineSubs.length) return <p className="text-sm text-gray-400">아직 입력된 점수가 없습니다.</p>;

  const compare = {
    type: "bar",
    data: { labels: subs.map((s) => s.name), datasets: [
      { label: "직전", data: subs.map((s) => (sum.prevs[s.name] === null ? null : sum.prevs[s.name] / SCALE)), backgroundColor: "#cbd5e1" },
      { label: exam.short, data: subs.map((s) => (sum.vals[s.name] === null ? null : sum.vals[s.name] / SCALE)), backgroundColor: "#059669" },
    ] },
    options: baseOpts({ scales: { y: { min: 0, max: 100 } } }),
  };
  const trend = {
    type: "line",
    data: { labels: seq.map((id) => examById[id].short), datasets: lineSubs.map((name) => ({
      label: name, data: seq.map((id) => { const v = valueS(sd, id, name); return v === null ? null : v / SCALE; }),
      borderColor: SUBJECT_COLORS[name], backgroundColor: SUBJECT_COLORS[name], spanGaps: true, tension: 0.2, pointRadius: 4,
    })) },
    options: baseOpts({ scales: { y: { min: 0, max: 100 } } }),
  };
  const card = (title, body) => (
    <div className="bg-white rounded-xl border border-gray-200 p-3 text-center">
      <div className="text-[11px] text-gray-500 font-bold mb-1">{title}</div>
      <div className="text-base md:text-lg font-black">{body}</div>
    </div>
  );
  return (
    <div className="space-y-4">
      <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
        {card(`${exam.short} 평균`, sum.n ? <span>{fmtX(sum.avgX)}<span className="text-xs text-gray-400 font-bold"> ({sum.n}/{sum.total}과목)</span></span> : "-")}
        {card("직전 대비 (과목별 변화 평균)", sum.dn ? <Delta d={sum.avgDeltaX} dec={DEC + 1} /> : "-")}
        {card("가장 많이 오른 과목", best && sum.deltas[best.name] > 0 ? <span>{best.name} <Delta d={sum.deltas[best.name]} /></span> : "-")}
        {card("가장 많이 내린 과목", worst && sum.deltas[worst.name] < 0 ? <span>{worst.name} <Delta d={sum.deltas[worst.name]} /></span> : "-")}
      </div>
      <div className="grid md:grid-cols-2 gap-4">
        <div className="bg-white rounded-xl border border-gray-200 p-3"><p className="text-sm font-bold text-gray-700 mb-2">과목별 직전 vs 이번</p><ChartBox config={compare} /></div>
        <div className="bg-white rounded-xl border border-gray-200 p-3"><p className="text-sm font-bold text-gray-700 mb-2">시험별 추이</p><ChartBox config={trend} /></div>
      </div>
    </div>
  );
};

/* ═════════════════════════ 9. 반 통계 (선생님 전용) ═════════════════════════ */
const StatsView = ({ dataByNo, roster, capture, onPickStudent, onCapture, notify }) => {
  const [examId, setExamId] = useState(() => {
    for (let i = EXAMS.length - 1; i >= 0; i--) if (ALL_NOS.some((no) => studentSummary(dataByNo[no], EXAMS[i].id).n > 0)) return EXAMS[i].id;
    return EXAMS[0].id;
  });
  const [basis, setBasis] = useState("__all__");
  const [order, setOrder] = useState("score");
  const exam = examById[examId];
  const subs = examSubjects(exam);
  const b = basis === "__all__" || subs.some((s) => s.name === basis) ? basis : "__all__";
  const basisName = b === "__all__" ? "전체 평균" : b;
  const label = (no) => `${no}번${roster[no] ? " " + roster[no] : ""}`;

  const rows = ALL_NOS.map((no) => {
    const s = studentSummary(dataByNo[no], examId);
    const score = b === "__all__" ? (s.n ? { num: s.sum, den: s.n } : null) : (s.vals[b] !== null ? { num: s.vals[b], den: 1 } : null);
    const delta = b === "__all__" ? (s.dn ? { num: s.dsum, den: s.dn } : null) : (s.deltas[b] !== null ? { num: s.deltas[b], den: 1 } : null);
    return { no, ...s, score, delta };
  });
  const keyOf = (r) => (order === "score" ? r.score : order === "no" ? null : r.delta);
  const sorted = [...rows].sort((x, y) => {
    if (order === "no") return x.no - y.no;
    const a = keyOf(x), c = keyOf(y);
    if (!a && !c) return x.no - y.no;
    if (!a) return 1;
    if (!c) return -1;
    const d = order === "down" ? cmpFrac(a, c) : cmpFrac(c, a);
    return d !== 0 ? d : x.no - y.no;
  });
  let rank = 0;
  sorted.forEach((r, i) => {
    const k = keyOf(r);
    if (order === "no" || !k) { r.rank = null; return; }
    if (i === 0 || cmpFrac(k, keyOf(sorted[i - 1])) !== 0) rank = i + 1;
    r.rank = rank;
  });

  const sstats = subs.map((s) => ({ sub: s, ...subjectStats(dataByNo, examId, s) }));
  let tSum = 0, tN = 0, dSum = 0, dN = 0, entered = 0;
  rows.forEach((r) => { tSum += r.sum; tN += r.n; dSum += r.dsum; dN += r.dn; if (r.n) entered++; });
  const top = rows.filter((r) => r.n).sort((x, y) => cmpFrac({ num: y.sum, den: y.n }, { num: x.sum, den: x.n }))[0];
  const fracX = (f) => (f ? roundDiv(f.num * 10, f.den) : null);

  const byScore = rows.filter((r) => r.score).sort((x, y) => cmpFrac(y.score, x.score) || x.no - y.no);
  const byDelta = rows.filter((r) => r.delta).sort((x, y) => cmpFrac(y.delta, x.delta) || x.no - y.no);
  const barH = (n) => Math.max(160, n * 22 + 50);
  const charts = {
    avg: { type: "bar", data: { labels: subs.map((s) => s.name), datasets: [
      { label: "직전 시험", data: sstats.map((s) => xToPt(s.prevMeanX)), backgroundColor: "#cbd5e1" },
      { label: exam.short, data: sstats.map((s) => xToPt(s.meanX)), backgroundColor: "#059669" } ] },
      options: baseOpts({ scales: { y: { min: 0, max: 100 } } }) },
    dist: { type: "bar", data: { labels: subs.map((s) => s.name), datasets: ["A", "B", "C", "D", "E"].map((g) => ({
      label: g, data: sstats.map((s) => s.dist[g] ?? 0), backgroundColor: GRADE_COLORS[g] })) },
      options: baseOpts({ scales: { x: { stacked: true }, y: { stacked: true, ticks: { precision: 0 } } } }) },
    score: { type: "bar", data: { labels: byScore.map((r) => label(r.no)), datasets: [{ label: `${basisName} 점수`,
      data: byScore.map((r) => xToPt(fracX(r.score))), backgroundColor: "#10b981" }] },
      options: baseOpts({ indexAxis: "y", scales: { x: { min: 0, max: 100 } }, plugins: { legend: { display: false } } }) },
    delta: { type: "bar", data: { labels: byDelta.map((r) => label(r.no)), datasets: [{ label: `${basisName} 변화`,
      data: byDelta.map((r) => xToPt(fracX(r.delta))), backgroundColor: byDelta.map((r) => (r.delta.num > 0 ? "#ef4444" : r.delta.num < 0 ? "#3b82f6" : "#9ca3af")) }] },
      options: baseOpts({ indexAxis: "y", plugins: { legend: { display: false } } }) },
  };

  const exportExcel = async () => {
    try { await loadLib("xlsx"); } catch (e) { return notify("오류 안내", "엑셀 기능을 불러오지 못했습니다. 네트워크를 확인해 주세요.", "error"); }
    const head = ["순위", "번호", "이름", ...subs.flatMap((s) => [s.name, `${s.name} 변화`]), "평균", "과목별 변화 평균"];
    const body = sorted.map((r) => [r.rank ?? "", r.no, roster[r.no] || "",
      ...subs.flatMap((s) => [r.vals[s.name] === null ? "" : r.vals[s.name] / SCALE, r.deltas[s.name] === null ? "" : r.deltas[s.name] / SCALE]),
      r.n ? xToPt(r.avgX) : "", r.dn ? xToPt(r.avgDeltaX) : ""]);
    const head2 = ["과목", "입력 인원", "평균", "중앙값", "최고", "최저", "표준편차", "직전 평균", "평균 변화", "성취도 분포"];
    const body2 = sstats.map((s) => [s.sub.name, s.n, xToPt(s.meanX) ?? "", xToPt(s.medianX) ?? "", s.max === null ? "" : s.max / SCALE, s.min === null ? "" : s.min / SCALE,
      s.sd === null ? "" : Number(s.sd.toFixed(2)), xToPt(s.prevMeanX) ?? "", xToPt(s.changeX) ?? "", Object.entries(s.dist).map(([g, c]) => `${g}:${c}`).join(" ")]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([head, ...body]), "학생별");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([head2, ...body2]), "과목별");
    XLSX.writeFile(wb, `${exam.label}_통계_${basisName}_${{ no: "번호순", score: "점수순", up: "상승순", down: "하락순" }[order]}.xlsx`);
  };

  const selCls = "w-full p-2.5 rounded-lg border border-gray-300 font-bold text-emerald-800 outline-none focus:ring-2 focus:ring-emerald-500 text-base md:text-sm bg-white";
  const box = (title, child, note) => (
    <div className="bg-white rounded-xl border border-gray-200 p-3 md:p-4">
      <p className="text-sm md:text-base font-bold text-gray-800 mb-2">{title}</p>{child}
      {note && <p className="text-[11px] text-gray-400 mt-2">{note}</p>}
    </div>
  );
  const card = (t, v) => <div className="bg-white rounded-xl border border-gray-200 p-3 text-center"><div className="text-[11px] text-gray-500 font-bold mb-1">{t}</div><div className="text-base md:text-xl font-black">{v}</div></div>;

  return (
    <div id="stats-area" className="space-y-4 bg-emerald-50" style={capture ? { width: 1000, padding: 16 } : undefined}>
      <div className="bg-white rounded-xl shadow-sm p-4 grid md:grid-cols-3 gap-3">
        <label className="block"><span className="block text-xs font-bold text-gray-600 mb-1">시험</span>
          <select value={examId} onChange={(e) => setExamId(e.target.value)} className={selCls}>{EXAMS.map((e) => <option key={e.id} value={e.id}>{e.label}</option>)}</select></label>
        <label className="block"><span className="block text-xs font-bold text-gray-600 mb-1">기준</span>
          <select value={b} onChange={(e) => setBasis(e.target.value)} className={selCls}>
            <option value="__all__">전체 (과목 평균)</option>{subs.map((s) => <option key={s.name} value={s.name}>{s.name}</option>)}
          </select></label>
        <label className="block"><span className="block text-xs font-bold text-gray-600 mb-1">정렬</span>
          <select value={order} onChange={(e) => setOrder(e.target.value)} className={selCls}>
            <option value="score">점수 높은순</option><option value="up">상승폭 큰순</option><option value="down">하락폭 큰순</option><option value="no">번호순</option>
          </select></label>
        {!capture && (
          <div className="md:col-span-3 flex flex-wrap gap-2">
            <button type="button" onClick={exportExcel} className="px-4 py-2 rounded-lg bg-blue-600 text-white font-bold text-sm flex items-center gap-1.5"><Download className="w-4 h-4" /> 엑셀로 내보내기</button>
            <button type="button" onClick={() => onCapture(exam.label)} className="px-4 py-2 rounded-lg bg-gray-800 text-white font-bold text-sm flex items-center gap-1.5"><ImageIcon className="w-4 h-4" /> 이미지로 저장</button>
          </div>
        )}
      </div>

      <h2 className="text-lg md:text-xl font-bold text-emerald-800 flex items-center gap-2"><BarChart className="w-5 h-5" /> {exam.label} · 기준: {basisName}</h2>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
        {card("점수 입력 인원", `${entered} / ${STUDENT_COUNT}명`)}
        {card("반 전체 평균", tN ? fmtX(roundDiv(tSum * 10, tN)) : "-")}
        {card("직전 대비 평균 변화", dN ? <Delta d={roundDiv(dSum * 10, dN)} dec={DEC + 1} /> : "-")}
        {card("최고 평균", top ? <span>{fmtX(top.avgX)} <span className="text-xs text-gray-500">{label(top.no)}</span></span> : "-")}
      </div>

      <div className="grid md:grid-cols-2 gap-4">
        {box("과목별 반 평균 (직전 vs 이번)", <ChartBox config={charts.avg} />)}
        {box("성취도 분포", <ChartBox config={charts.dist} />, exam.kind === "final" ? "학기말 환산총점 기준" : "이번 시험 점수만으로 본 참고용 분포")}
        {box(`${basisName} 점수 순위`, byScore.length ? <ChartBox config={charts.score} height={barH(byScore.length)} /> : <p className="text-sm text-gray-400">데이터 없음</p>)}
        {box(`${basisName} 직전 대비 변화 (상승 빨강 · 하락 파랑)`, byDelta.length ? <ChartBox config={charts.delta} height={barH(byDelta.length)} /> : <p className="text-sm text-gray-400">비교할 직전 시험 데이터가 없습니다</p>)}
      </div>

      {box("과목별 통계", (
        <div className="overflow-x-auto">
          <table className="w-full min-w-[720px] text-sm text-center border-collapse">
            <thead><tr className="bg-gray-50 text-gray-700 text-xs">
              {["과목", "입력", "평균", "중앙값", "최고", "최저", "표준편차", "직전 평균", "평균 변화", "성취도 분포"].map((h) => <th key={h} className="p-2 font-bold">{h}</th>)}
            </tr></thead>
            <tbody>{sstats.map((s) => (
              <tr key={s.sub.name} className={`border-t border-gray-100 ${b === s.sub.name ? "bg-yellow-50" : ""}`}>
                <td className="p-2 font-bold">{s.sub.name}</td><td className="p-2">{s.n}</td>
                <td className="p-2 font-bold">{s.meanX === null ? "-" : fmtX(s.meanX)}</td>
                <td className="p-2">{s.medianX === null ? "-" : fmtX(s.medianX)}</td>
                <td className="p-2">{s.max === null ? "-" : fmtS(s.max)}</td><td className="p-2">{s.min === null ? "-" : fmtS(s.min)}</td>
                <td className="p-2">{s.sd === null ? "-" : s.sd.toFixed(2)}</td>
                <td className="p-2">{s.prevMeanX === null ? "-" : fmtX(s.prevMeanX)}</td>
                <td className="p-2"><Delta d={s.changeX} dec={DEC + 1} /></td>
                <td className="p-2 text-xs whitespace-nowrap">{Object.entries(s.dist).map(([g, c]) => <span key={g} className={`mr-1.5 font-bold ${GRADE_TEXT[g]}`}>{g}{c}</span>)}</td>
              </tr>
            ))}</tbody>
          </table>
        </div>
      ), "평균 변화 = 이번 반 평균 − 직전 시험 반 평균")}

      {box(`학생별 성적 · ${basisName} ${{ no: "번호순", score: "점수 높은순", up: "상승폭 큰순", down: "하락폭 큰순" }[order]}`, (
        <div className="overflow-x-auto">
          <table className="w-full text-sm text-center border-collapse" style={{ minWidth: 260 + subs.length * 70 }}>
            <thead><tr className="bg-gray-50 text-gray-700 text-xs">
              <th className="p-2 font-bold">순위</th><th className="p-2 font-bold text-left">학생</th>
              {subs.map((s) => <th key={s.name} className={`p-2 font-bold ${b === s.name ? "bg-yellow-100" : ""}`}>{s.name}</th>)}
              <th className={`p-2 font-bold ${b === "__all__" ? "bg-yellow-100" : ""}`}>평균</th><th className={`p-2 font-bold ${b === "__all__" ? "bg-yellow-100" : ""}`}>변화 평균</th>
            </tr></thead>
            <tbody>{sorted.map((r) => (
              <tr key={r.no} onClick={() => !capture && onPickStudent(r.no, examId)} className={`border-t border-gray-100 ${capture ? "" : "cursor-pointer hover:bg-emerald-50"} ${r.n ? "" : "text-gray-300"}`}>
                <td className="p-2 font-black text-emerald-700">{r.rank ?? "-"}</td>
                <td className="p-2 font-bold text-left whitespace-nowrap">{label(r.no)}</td>
                {subs.map((s) => (
                  <td key={s.name} className={`p-1.5 leading-tight ${b === s.name ? "bg-yellow-50" : ""}`}>
                    <div className="font-bold">{r.vals[s.name] === null ? "-" : fmtS(r.vals[s.name])}</div>
                    <div className="text-[10px]"><Delta d={r.deltas[s.name]} /></div>
                  </td>
                ))}
                <td className={`p-2 font-bold ${b === "__all__" ? "bg-yellow-50" : ""}`}>{r.n ? fmtX(r.avgX) : "-"}{r.n && r.n < r.total ? <span className="text-[10px] text-gray-400"> ({r.n}과목)</span> : null}</td>
                <td className={`p-2 ${b === "__all__" ? "bg-yellow-50" : ""}`}><Delta d={r.dn ? r.avgDeltaX : null} dec={DEC + 1} /></td>
              </tr>
            ))}</tbody>
          </table>
        </div>
      ), "직전 대비는 그 과목이 실제로 치러진 바로 앞 시험과 비교합니다. 변화 평균 = 비교 가능한 과목들의 변화량 평균. 줄을 누르면 그 학생 화면으로 이동합니다.")}
    </div>
  );
};

/* ═════════════════════════ 10. 로그인 ═════════════════════════ */
const LoginScreen = () => {
  const [mode, setMode] = useState(null);
  const [no, setNo] = useState(null);
  const [step, setStep] = useState("pick");      // pick | loading | login | setup | closed
  const [slotInfo, setSlotInfo] = useState(null);
  const [pin, setPin] = useState("");
  const [pin2, setPin2] = useState("");
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(false);
  const pickSeq = useRef(0);
  const back = () => { setMode(null); setNo(null); setStep("pick"); setPin(""); setPin2(""); setErr(""); };

  const pickNo = async (n) => {
    const my = ++pickSeq.current;
    setNo(n); setPin(""); setPin2(""); setErr(""); setStep("loading");
    try {
      const [slot, st] = await Promise.all([withTimeout(readSlot(n), 15000), withTimeout(getDoc(settingsRef), 15000)]);
      if (my !== pickSeq.current) return;
      const open = st.exists() && st.data().signupOpen === true;
      setSlotInfo(slot);
      setStep(slot.uid ? "login" : open ? "setup" : "closed");
    } catch (e) { if (my === pickSeq.current) { setErr(errorMessage(e)); setStep("pick"); } }
  };

  const login = async () => {
    if (loading) return;
    if (!new RegExp(`^\\d{${PIN_LEN}}$`).test(pin)) return setErr(`숫자 ${PIN_LEN}자리를 입력하세요.`);
    setLoading(true); setErr("");
    try { await signInWithEmailAndPassword(auth, emailOf(no, slotInfo.ver), pinPwd(pin)); }
    catch (e) { setErr(errorMessage(e)); setPin(""); setLoading(false); }
  };

  const setup = async () => {
    if (loading) return;
    if (!new RegExp(`^\\d{${PIN_LEN}}$`).test(pin)) return setErr(`숫자 ${PIN_LEN}자리로 정해 주세요.`);
    if (pin !== pin2) return setErr("두 번 입력한 비밀번호가 다릅니다.");
    setLoading(true); setErr("");
    authHooks.settingUp = true;
    const email = emailOf(no, slotInfo.ver);
    let created = false;
    try {
      try { await createUserWithEmailAndPassword(auth, email, pinPwd(pin)); created = true; }
      catch (e) {
        if (e.code !== "auth/email-already-in-use") throw e;
        await signInWithEmailAndPassword(auth, email, pinPwd(pin));   // 이전 시도에서 계정만 만들어진 경우
      }
      await withTimeout(setDoc(slotRef(no), { ver: slotInfo.ver, uid: auth.currentUser.uid }), 15000);
      authHooks.settingUp = false;
      if (authHooks.recheck) authHooks.recheck();
    } catch (e) {
      authHooks.settingUp = false;
      const u = auth.currentUser;
      if (u) { if (created) await deleteUser(u).catch(() => signOut(auth)); else await signOut(auth).catch(() => {}); }
      setLoading(false); setPin(""); setPin2("");
      setErr(e.code === "permission-denied"
        ? "지금은 비밀번호를 새로 만들 수 없습니다.\n선생님이 '최초 비밀번호 설정'을 열어 두셨는지, 이미 누가 설정했는지 확인해 주세요."
        : (e.code === "auth/invalid-credential" || e.code === "auth/wrong-password" || e.code === "auth/invalid-login-credentials")
          ? "이 번호는 이미 다른 비밀번호로 설정되어 있습니다. 선생님께 말씀하세요."
          : errorMessage(e));
    }
  };

  const googleLogin = async () => {
    if (loading) return;
    setErr(""); setLoading(true);
    try {
      const provider = new GoogleAuthProvider();
      provider.setCustomParameters({ prompt: "select_account" });
      await signInWithPopup(auth, provider);
    } catch (e) {
      setLoading(false);
      if (e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request") return;
      setErr(errorMessage(e));
    }
  };

  const pinInput = (value, set, ph, onEnter, auto) => (
    <input type="password" value={value} autoFocus={auto} inputMode="numeric" maxLength={PIN_LEN} autoComplete="off"
      onChange={(e) => { set(e.target.value.replace(/\D/g, "").slice(0, PIN_LEN)); if (err) setErr(""); }}
      onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); onEnter(); } }}
      placeholder={ph} className="w-full p-3 border rounded-lg outline-none text-center tracking-[0.4em] text-xl font-bold focus:ring-2 focus:ring-emerald-500" />
  );

  return (
    <div className="min-h-screen bg-emerald-50 flex flex-col items-center justify-center p-4">
      <div className="bg-white rounded-3xl shadow-xl overflow-hidden w-full max-w-sm relative">
        {loading && <div className="absolute inset-0 bg-white/80 flex flex-col items-center justify-center z-50 text-emerald-600"><Spinner className="w-8 h-8 mb-3" /><span className="text-lg font-bold text-emerald-800">처리 중...</span></div>}
        <div className="bg-emerald-600 p-6 text-center text-white">
          <Award className="w-10 h-10 mx-auto mb-3" />
          <h1 className="text-xl font-bold mb-1">상정중 3-1 성적 향상 프로젝트 <span className="text-xs text-yellow-300 ml-1 font-black">{VERSION}</span></h1>
          <p className="text-emerald-100 text-sm">아름샘이 항상 응원해! 💪✨</p>
        </div>
        <div className="p-6">
          {!mode && (
            <div className="space-y-3">
              <button type="button" onClick={() => setMode("student")} className="w-full py-3.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 rounded-xl font-bold flex items-center justify-center gap-2"><User className="w-5 h-5" /> 학생 접속</button>
              <button type="button" onClick={() => setMode("teacher")} className="w-full py-3.5 bg-blue-50 hover:bg-blue-100 text-blue-800 rounded-xl font-bold flex items-center justify-center gap-2"><Users className="w-5 h-5" /> 관리자 접속</button>
            </div>
          )}
          {mode === "student" && (
            <div className="space-y-4">
              <h2 className="text-lg font-bold text-center text-gray-800 flex items-center justify-center gap-2"><User className="w-4 h-4" /> 내 번호 선택</h2>
              <div className="grid grid-cols-6 gap-1.5">
                {ALL_NOS.map((n) => (
                  <button key={n} type="button" onClick={() => pickNo(n)}
                    className={`py-2 rounded-lg font-bold text-sm border ${no === n ? "bg-emerald-600 text-white border-emerald-600" : "bg-white text-gray-700 border-gray-200 hover:bg-emerald-50"}`}>{n}</button>
                ))}
              </div>
              {step === "loading" && <p className="text-center text-sm text-gray-500 font-bold">확인 중...</p>}
              {step === "login" && (
                <>
                  <p className="text-center text-sm font-bold text-emerald-700">{no}번 · 비밀번호 {PIN_LEN}자리를 입력하세요</p>
                  {pinInput(pin, setPin, "● ● ● ●", login, true)}
                  <button type="button" onClick={login} className="w-full py-3 text-white rounded-lg font-bold bg-emerald-600 hover:bg-emerald-700 text-sm shadow-md">로그인</button>
                </>
              )}
              {step === "setup" && (
                <>
                  <div className="p-3 bg-yellow-50 border border-yellow-200 rounded-lg text-xs text-yellow-800 font-semibold leading-relaxed">
                    {no}번은 처음 접속이에요. 나만 아는 <span className="text-red-500">숫자 {PIN_LEN}자리</span> 비밀번호를 만들어 주세요.<br/>생일·1234·0000처럼 쉬운 번호는 피하세요.
                  </div>
                  {pinInput(pin, setPin, "새 비밀번호", () => {}, true)}
                  {pinInput(pin2, setPin2, "한 번 더 입력", setup, false)}
                  <button type="button" onClick={setup} className="w-full py-3 text-white rounded-lg font-bold bg-yellow-500 hover:bg-yellow-600 text-sm shadow-md">비밀번호 만들고 시작하기</button>
                </>
              )}
              {step === "closed" && (
                <div className="p-3 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-600 text-center leading-relaxed">
                  {no}번은 아직 비밀번호가 없어요.<br/>선생님이 '최초 비밀번호 설정'을 열어 주시면 만들 수 있어요.
                </div>
              )}
              {err && <p className="text-red-500 font-bold text-xs text-center whitespace-pre-wrap">{err}</p>}
              <p className="text-[11px] text-gray-500 text-center">비밀번호를 잊었으면 선생님께 초기화를 요청하세요.</p>
              <button type="button" onClick={back} className="w-full py-2 text-gray-500 font-semibold text-xs">돌아가기</button>
            </div>
          )}
          {mode === "teacher" && (
            <div className="space-y-4">
              <h2 className="text-lg font-bold text-center text-gray-800 flex items-center justify-center gap-2"><Lock className="w-4 h-4" /> 관리자 로그인</h2>
              <button type="button" onClick={googleLogin} className="w-full py-3.5 rounded-lg font-bold border-2 border-gray-300 bg-white hover:bg-gray-50 text-gray-800 text-sm shadow-sm">Google 계정으로 로그인</button>
              <p className="text-[11px] text-gray-500 text-center leading-relaxed">관리자로 등록된 구글 계정만 들어갈 수 있습니다.<br/>로그인 창이 안 뜨면 팝업 차단을 해제해 주세요.</p>
              {err && <p className="text-red-500 font-bold text-xs text-center whitespace-pre-wrap">{err}</p>}
              <button type="button" onClick={back} className="w-full py-2 text-gray-500 font-semibold text-xs">돌아가기</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
};

/* ═════════════════════════ 11. 메인 앱 ═════════════════════════ */
const SAVE_CHIP = {
  idle: ["bg-gray-100 text-gray-500", "입력하면 자동 저장"],
  saving: ["bg-yellow-100 text-yellow-800", "저장 중..."],
  saved: ["bg-emerald-100 text-emerald-700", "저장됨 ✓"],
  error: ["bg-red-100 text-red-700", "저장 실패 · 다시 입력해 주세요"],
};

const App = () => {
  const [authReady, setAuthReady] = useState(false);
  const [checking, setChecking] = useState(false);
  const [role, setRole] = useState(null);
  const [myNo, setMyNo] = useState(null);
  const [roster, setRoster] = useState({});
  const [slots, setSlots] = useState({});
  const [signupOpen, setSignupOpen] = useState(false);
  const [selectedNo, setSelectedNo] = useState(1);
  const [examId, setExamId] = useState(EXAMS[0].id);
  const [tab, setTab] = useState("student");
  const [dataByNo, setDataByNo] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [live, setLive] = useState(false);
  const [netOnline, setNetOnline] = useState(navigator.onLine);
  const [listenError, setListenError] = useState(null);
  const [modal, setModal] = useState(null);
  const [busy, setBusy] = useState("");
  const [capture, setCapture] = useState(false);
  const [saveStatus, setSaveStatus] = useState("idle");
  const [selfTest, setSelfTest] = useState(null);
  const pending = useRef(0);
  const autoPicked = useRef(false);
  const fileRef = useRef(null);
  const logoutRef = useRef(null);

  const openModal = (cfg) => setModal({ id: `${Date.now()}_${Math.random()}`, ...cfg });
  const notify = (title, message, tone = "info") => openModal({ title, message, tone });
  const notifyError = (e) => notify("오류 안내", typeof e === "string" ? e : errorMessage(e), "error");

  useEffect(() => { window.__APP_STARTED = true; }, []);

  // 로그인 상태 → 역할 판단 (코드가 아니라 서버 데이터로 확인)
  //  · 구글 로그인: 관리자 전용 데이터를 읽어 보고, 보안 규칙이 허락하면 관리자
  //  · 학생 로그인: 그 번호의 자리(slot)를 이 계정이 차지하고 있는지 확인
  useEffect(() => {
    let seq = 0;
    const resolve = async (u) => {
      const my = ++seq;
      autoPicked.current = false;
      setListenError(null); setRoster({}); setDataByNo({}); setLoaded(false); setSaveStatus("idle"); setTab("student");
      setRole(null); setMyNo(null); setChecking(false);
      if (!u) { setAuthReady(true); return; }
      const isGoogle = (u.providerData || []).some((p) => p.providerId === "google.com");
      if (isGoogle) {
        setChecking(true); setAuthReady(true);
        try {
          await getDocs(query(collection(db, ROOT), limit(1)));
          if (my !== seq) return;
          setRole("teacher");
        } catch (e) {
          if (my !== seq) return;
          if (e.code === "permission-denied") {
            await signOut(auth).catch(() => {});
            notify("관리자 계정이 아닙니다", "이 구글 계정은 관리자로 등록되어 있지 않습니다.\n등록된 구글 계정으로 다시 로그인해 주세요.", "error");
          } else {
            setRole("teacher");   // 네트워크 문제 등은 이후 화면에서 안내
          }
        } finally {
          if (my === seq) setChecking(false);
        }
        return;
      }
      if (authHooks.settingUp) { setAuthReady(true); return; }   // 최초 설정 진행 중 → 끝나면 다시 확인
      const m = (u.email || "").toLowerCase().match(/^s(\d{2})v(\d+)@(.+)$/);
      const no = m && m[3] === EMAIL_DOMAIN ? Number(m[1]) : 0;
      if (!(no >= 1 && no <= STUDENT_COUNT)) { await signOut(auth).catch(() => {}); setAuthReady(true); return; }
      setChecking(true); setAuthReady(true);
      try {
        const slot = await withTimeout(readSlot(no), 15000);
        if (my !== seq) return;
        if (slot.uid === u.uid && slot.ver === Number(m[2])) { setRole("student"); setMyNo(no); }
        else {
          await signOut(auth).catch(() => {});
          notify("비밀번호를 다시 만들어 주세요", "선생님이 비밀번호를 초기화했습니다.\n번호를 누르고 새 비밀번호를 만들어 주세요.", "error");
        }
      } catch (e) {
        if (my !== seq) return;
        setRole("student"); setMyNo(no);   // 네트워크 문제는 이후 화면에서 안내
      } finally {
        if (my === seq) setChecking(false);
      }
    };
    authHooks.recheck = () => resolve(auth.currentUser);
    return onAuthStateChanged(auth, resolve);
  }, []);

  // 명단
  useEffect(() => {
    if (!role) return;
    const onErr = (e) => { console.error(e); setListenError(e); };
    if (role === "teacher") {
      return onSnapshot(collection(db, ROOT), (snap) => {
        const r = {};
        snap.forEach((d) => { const n = Number(d.id.replace(/\D/g, "")); if (n) r[n] = String(d.data().name || "").trim(); });
        setRoster(r);
      }, onErr);
    }
    return onSnapshot(doc(db, ROOT, sidOf(myNo)), (d) => setRoster(d.exists() ? { [myNo]: String(d.data().name || "").trim() } : {}), onErr);
  }, [role, myNo]);

  // 선생님: 학생 비밀번호 설정 현황 · 최초 설정 스위치
  useEffect(() => {
    if (role !== "teacher") return;
    const u1 = onSnapshot(collection(db, "slots"), (snap) => {
      const r = {};
      snap.forEach((d) => { const n = Number(d.id.replace(/\D/g, "")); if (n) r[n] = { ver: Number.isInteger(d.data().ver) ? d.data().ver : 0, uid: d.data().uid || null }; });
      setSlots(r);
    }, console.error);
    const u2 = onSnapshot(settingsRef, (d) => setSignupOpen(d.exists() && d.data().signupOpen === true), console.error);
    return () => { u1(); u2(); };
  }, [role]);

  // 성적 데이터 실시간 구독 (선생님: 반 전체 / 학생: 본인만)
  useEffect(() => {
    if (!role) return;
    let everLive = false;
    const q = role === "teacher" ? collectionGroup(db, "exams") : collection(db, ROOT, sidOf(myNo), "exams");
    return onSnapshot(q, { includeMetadataChanges: true }, (snap) => {
      const m = {};
      snap.forEach((d) => {
        const studentDoc = d.ref.parent.parent;
        if (!studentDoc || !studentDoc.parent || studentDoc.parent.id !== ROOT) return;
        const no = /^s\d{2}$/.test(studentDoc.id) ? Number(studentDoc.id.slice(1)) : 0;
        if (no >= 1 && no <= STUDENT_COUNT) (m[no] = m[no] || {})[d.id] = d.data();
      });
      if (!snap.metadata.fromCache) everLive = true;
      setLive(!snap.metadata.fromCache);
      if (everLive) { setDataByNo(m); setLoaded(true); }   // 서버와 한 번이라도 연결된 뒤에만 표시
    }, (e) => { console.error(e); setListenError(e); });
  }, [role, myNo]);

  useEffect(() => {
    const on = () => setNetOnline(navigator.onLine);
    window.addEventListener("online", on); window.addEventListener("offline", on);
    return () => { window.removeEventListener("online", on); window.removeEventListener("offline", on); };
  }, []);

  // 선생님 로그인 시 계산 자동 검증
  useEffect(() => {
    if (role !== "teacher" || selfTest) return;
    const t = setTimeout(() => { const r = runSelfTests(); console.info("계산 검증", r); setSelfTest(r); }, 400);
    return () => clearTimeout(t);
  }, [role]);

  // 학생: 가장 최근 기록이 있는 시험 자동 선택
  useEffect(() => {
    if (role !== "student" || !loaded || autoPicked.current) return;
    autoPicked.current = true;
    const sd = dataByNo[myNo] || {};
    const withData = EXAMS.filter((e) => hasData(sd[e.id]) || studentSummary(sd, e.id).n > 0);
    if (withData.length) setExamId(withData[withData.length - 1].id);
  }, [role, loaded, dataByNo]);

  // 일정 시간 사용하지 않으면 자동 로그아웃
  useEffect(() => {
    if (!role) return;
    let last = Date.now();
    const bump = () => { last = Date.now(); };
    const evs = ["pointerdown", "keydown", "scroll", "touchstart"];
    evs.forEach((e) => window.addEventListener(e, bump, { passive: true }));
    const t = setInterval(() => { if (Date.now() - last > IDLE_MINUTES * 60000) logoutRef.current(true); }, 30000);
    return () => { evs.forEach((e) => window.removeEventListener(e, bump)); clearInterval(t); };
  }, [role]);

  /* ── 저장 ── */
  const track = (promise) => {
    pending.current += 1; setSaveStatus("saving");
    promise.then(() => { pending.current -= 1; if (pending.current === 0) setSaveStatus("saved"); })
      .catch((e) => { pending.current -= 1; console.error(e); setSaveStatus("error"); if (auth.currentUser) notifyError(e); });
  };
  const isTeacher = role === "teacher";
  const activeNo = isTeacher ? selectedNo : myNo;
  const sd = dataByNo[activeNo] || {};
  const exam = examById[examId];
  const isFinal = exam.kind === "final";
  const subjects = SUBJECTS[exam.sem];
  const studentLabel = (n) => `${n}번${roster[n] ? " " + roster[n] : ""}`;
  const del = (v) => (v === null ? deleteField() : v);
  const patchDoc = (id, patch) => track(setDoc(examRef(activeNo, id), patch, { merge: true }));
  const setScore = (id, name) => (v) => patchDoc(id, { scores: { [name]: del(v) } });
  const setPerf = (name) => (v) => patchDoc(examIdOf(exam.sem, "final"), { perf: { [name]: del(v) } });
  const setTarget = (name) => (v) => patchDoc(examId, { plan: { targets: { [name]: del(v) } } });
  const setExpPerf = (name) => (v) => patchDoc(examId, { plan: { expectedPerf: { [name]: v } } });
  const saveResolution = (no, id) => (text) => track(setDoc(examRef(no, id), { plan: { resolution: text } }, { merge: true }));

  /* ── 계정 ── */
  const logout = async (idle) => {
    setBusy("로그아웃 중...");
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    await new Promise((r) => setTimeout(r, 50));
    try { await withTimeout(waitForPendingWrites(db), 5000); } catch (e) { /* 오프라인이면 그대로 진행 */ }
    setModal(null);
    await signOut(auth).catch(console.error);
    setBusy("");
    if (idle === true) notify("자동 로그아웃", `${IDLE_MINUTES}분 동안 사용하지 않아 안전을 위해 로그아웃했습니다.`);
  };
  logoutRef.current = logout;

  // 학생 전용 (선생님은 구글 계정이라 비밀번호를 구글에서 관리)
  const changePassword = () => openModal({
    title: "비밀번호 변경", cancel: true, confirmText: "변경",
    message: `새 비밀번호를 숫자 ${PIN_LEN}자리로 정해 주세요. 생일·1234처럼 쉬운 번호는 피하세요.`,
    fields: [
      { key: "p1", label: "새 비밀번호", type: "password", inputMode: "numeric", maxLength: PIN_LEN, digits: true },
      { key: "p2", label: "새 비밀번호 확인", type: "password", inputMode: "numeric", maxLength: PIN_LEN, digits: true },
    ],
    onConfirm: async ({ p1, p2 }) => {
      if (!new RegExp(`^\\d{${PIN_LEN}}$`).test(p1 || "")) return `숫자 ${PIN_LEN}자리로 정해 주세요.`;
      if (p1 !== p2) return "두 비밀번호가 같지 않습니다.";
      await updatePassword(auth.currentUser, pinPwd(p1));
      notify("완료", "비밀번호가 변경되었습니다.", "success");
    },
  });

  // 선생님: 최초 설정 스위치 · 학생 비밀번호 초기화
  const toggleSignup = () => {
    const next = !signupOpen;
    openModal({
      title: next ? "최초 비밀번호 설정 열기" : "최초 비밀번호 설정 닫기", cancel: true, confirmText: next ? "열기" : "닫기",
      message: next
        ? "열려 있는 동안에는 아직 비밀번호가 없는 번호를 누구나 먼저 설정할 수 있습니다.\n학생들이 설정하는 시간에만 열고, 끝나면 꼭 닫아 주세요."
        : "닫으면 새로 비밀번호를 만들 수 없습니다. 이미 만든 학생은 계속 로그인할 수 있습니다.",
      onConfirm: async () => { await withTimeout(setDoc(settingsRef, { signupOpen: next }, { merge: true }), 15000); },
    });
  };
  const resetStudentPin = (no) => openModal({
    title: "비밀번호 초기화", tone: "danger", cancel: true, confirmText: "초기화",
    message: `${studentLabel(no)} 학생의 비밀번호를 초기화합니다.\n성적은 그대로 남고, 학생은 '최초 비밀번호 설정'이 열려 있을 때 새 비밀번호를 만들 수 있습니다.`,
    onConfirm: async () => {
      const cur = slots[no] || { ver: 0 };
      await withTimeout(setDoc(slotRef(no), { ver: (cur.ver || 0) + 1, uid: null }), 15000);
      notify("완료", `${studentLabel(no)} 학생의 비밀번호를 초기화했습니다.` + (signupOpen ? "" : "\n학생이 새로 만들려면 '최초 비밀번호 설정'을 열어 주세요."), "success");
    },
  });

  /* ── 엑셀 업로드 ── */
  const templateColumns = (ex) => {
    const subs = SUBJECTS[ex.sem];
    if (ex.kind === "final") return subs.flatMap((s) => [s.r1 ? `${s.name}_1차` : null, s.r2 ? `${s.name}_2차` : null, s.rp ? `${s.name}_수행` : null].filter(Boolean));
    return examSubjects(ex).map((s) => s.name);
  };
  const downloadTemplate = async () => {
    try { await loadLib("xlsx"); } catch (e) { return notifyError("엑셀 기능을 불러오지 못했습니다. 네트워크를 확인해 주세요."); }
    const ws = XLSX.utils.aoa_to_sheet([["번호", "이름", ...templateColumns(exam)], ...ALL_NOS.map((n) => [n, roster[n] || ""])]);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "성적");
    XLSX.writeFile(wb, `${exam.label}_업로드양식.xlsx`);
  };
  const matchStudent = (cell) => {
    const s = String(cell ?? "").trim();
    if (!s) return null;
    const m = s.match(/^(\d{1,2})(?!\d)/);
    if (m) { const n = Number(m[1]); return n >= 1 && n <= STUDENT_COUNT ? n : null; }
    const hit = Object.entries(roster).find(([, name]) => name && (name === s || s.endsWith(name)));
    return hit ? Number(hit[0]) : null;
  };
  const parseUpload = async (file, ex) => {
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "" });
    if (rows.length < 2) throw new Error("NO_DATA");
    const headers = rows[0].map((h) => String(h ?? "").trim());
    const subByName = Object.fromEntries(SUBJECTS[ex.sem].map((s) => [s.name, s]));
    const TYPE = { "1차": "e1", "2차": "e2", "수행": "perf" };
    const cols = [], ignored = [];
    headers.forEach((h, j) => {
      if (j === 0 || !h || h === "이름" || h === "번호") return;
      let sub, field;
      if (ex.kind === "final") {
        const [name, t] = h.split("_").map((x) => x.trim());
        sub = subByName[name];
        if (sub) {
          field = TYPE[t];
          if (!t) { const nz = [["e1", sub.r1], ["e2", sub.r2], ["perf", sub.rp]].filter(([, r]) => r > 0); field = nz.length === 1 ? nz[0][0] : null; }
        }
      } else { sub = subByName[h]; field = ex.kind; }
      const ratio = !sub || !field ? 0 : field === "e1" ? sub.r1 : field === "e2" ? sub.r2 : sub.rp;
      if (!ratio) return ignored.push(h);
      cols.push({ j, sub, field, max: field === "perf" ? sub.rp : 100, docId: field === "perf" ? examIdOf(ex.sem, "final") : examIdOf(ex.sem, field) });
    });
    const updates = new Map(), unknown = [], mismatch = [], students = new Set();
    let cells = 0, clamped = 0, rounded = 0, bad = 0;
    for (let i = 1; i < rows.length; i++) {
      const row = rows[i];
      if (row.every((c) => String(c).trim() === "")) continue;
      const no = matchStudent(row[0]) ?? matchStudent(row[1]);
      if (!no) { unknown.push(`${i + 1}행`); continue; }
      const nameCell = String(row[1] ?? "").trim();
      if (headers[1] === "이름" && nameCell && roster[no] && nameCell !== roster[no]) { mismatch.push(`${i + 1}행(${no}번≠${nameCell})`); continue; }
      for (const c of cols) {
        const cell = row[c.j];
        if (cell === "" || cell === null || cell === undefined) continue;
        const n = Number(String(cell).trim());
        if (!Number.isFinite(n)) { bad++; continue; }
        if (Math.abs(n * SCALE - Math.round(n * SCALE)) > 1e-9) rounded++;
        const s = clamp(Math.round(n * SCALE), 0, c.max * SCALE);
        if (s !== Math.round(n * SCALE)) clamped++;
        const key = `${no}|${c.docId}`;
        const u = updates.get(key) || { no, docId: c.docId, patch: {} };
        ensure(u.patch, c.field === "perf" ? "perf" : "scores")[c.sub.name] = s / SCALE;
        updates.set(key, u);
        students.add(no); cells++;
      }
    }
    return { updates, students: students.size, unknown, mismatch, ignored, cells, clamped, rounded, bad };
  };
  const handleUpload = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const ex = exam;
    let parsed;
    setBusy("엑셀 읽는 중...");
    try { await loadLib("xlsx"); parsed = await parseUpload(file, ex); }
    catch (err) { setBusy(""); return notifyError(err.message === "NO_DATA" ? "엑셀에 데이터가 없습니다." : "엑셀 파일을 읽지 못했습니다. 양식을 확인해 주세요."); }
    setBusy("");
    const notes = [];
    if (parsed.unknown.length) notes.push(`• 학생을 찾지 못한 행: ${parsed.unknown.join(", ")}`);
    if (parsed.mismatch.length) notes.push(`• 번호·이름 불일치로 건너뛴 행: ${parsed.mismatch.join(", ")}`);
    if (parsed.ignored.length) notes.push(`• 무시한 열: ${parsed.ignored.join(", ")}`);
    if (parsed.bad) notes.push(`• 숫자가 아닌 칸 ${parsed.bad}개 무시`);
    if (parsed.rounded) notes.push(`• 소수 둘째 자리 이하가 있는 점수 ${parsed.rounded}개를 0.1점 단위로 반올림`);
    if (parsed.clamped) notes.push(`• 범위를 벗어난 점수 ${parsed.clamped}개를 0~만점으로 보정`);
    if (!parsed.updates.size) return notify("업로드할 점수 없음", notes.join("\n") || "인식된 점수가 없습니다.", "error");
    openModal({
      title: "업로드 확인", cancel: true, confirmText: "업로드",
      message: `[${ex.label}]\n${parsed.students}명 · 점수 ${parsed.cells}개를 저장합니다.\n같은 칸의 기존 점수는 덮어씁니다.` + (notes.length ? `\n\n${notes.join("\n")}` : ""),
      onConfirm: async () => {
        const batch = writeBatch(db);
        parsed.updates.forEach((u) => batch.set(examRef(u.no, u.docId), u.patch, { merge: true }));
        await withTimeout(batch.commit(), 20000);
        notify("완료", `${parsed.students}명 학생의 점수가 저장되었고, 모든 기기에 바로 반영됩니다.`, "success");
      },
    });
  };

  /* ── 학생 명단 ── */
  const editRoster = () => openModal({
    title: "학생 명단 등록/수정", cancel: true, confirmText: "저장",
    message: "한 줄에 '번호 이름' 형식으로 적어 주세요. (예: 1 홍길동)",
    fields: [{ key: "text", label: "명단", type: "textarea", initial: ALL_NOS.map((n) => `${n} ${roster[n] || ""}`.trim()).join("\n") }],
    onConfirm: async ({ text }) => {
      const batch = writeBatch(db);
      let count = 0;
      String(text || "").split("\n").forEach((line) => {
        const m = line.trim().match(/^(\d{1,2})\s*번?\s+(.{1,20})$/);
        if (!m) return;
        const n = Number(m[1]);
        if (n < 1 || n > STUDENT_COUNT) return;
        batch.set(doc(db, ROOT, sidOf(n)), { no: n, name: m[2].trim() }, { merge: true });
        count++;
      });
      if (!count) return "저장할 줄이 없습니다. '번호 이름' 형식인지 확인해 주세요.";
      await withTimeout(batch.commit(), 20000);
      notify("완료", `${count}명의 이름을 저장했습니다.`, "success");
    },
  });

  /* ── 이미지 저장 ── */
  const downloadImage = (areaId, filename) => {
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    window.scrollTo(0, 0);
    setBusy("이미지 만드는 중...");
    loadLib("h2c").then(() => {
      setCapture(true);
      setTimeout(async () => {
        try {
          const el = document.getElementById(areaId);
          const canvas = await window.html2canvas(el, { scale: 2, backgroundColor: "#ffffff", useCORS: true, windowWidth: 1100, scrollX: 0, scrollY: 0 });
          const a = document.createElement("a");
          a.download = filename.replace(/\s+/g, "_");
          a.href = canvas.toDataURL("image/png");
          document.body.appendChild(a); a.click(); a.remove();
          notify("완료", "이미지를 저장했습니다.\n(휴대폰은 '다운로드' 또는 '파일' 앱에서 확인하세요.)", "success");
        } catch (err) { console.error(err); notifyError("이미지 저장 중 오류가 발생했습니다."); }
        finally { setCapture(false); setBusy(""); }
      }, 400);
    }).catch(() => { setBusy(""); notifyError("이미지 기능을 불러오지 못했습니다. 네트워크를 확인해 주세요."); });
  };

  /* ── 화면 ── */
  let content;
  if (!authReady || checking) {
    content = <div className="min-h-screen flex flex-col gap-3 items-center justify-center font-bold text-emerald-600"><Spinner /><span>{checking ? "계정 확인 중..." : "불러오는 중..."}</span></div>;
  } else if (!role) {
    content = <LoginScreen />;
  } else if (listenError) {
    const msg = role === "student" && listenError.code === "permission-denied"
      ? "접속 권한이 없습니다.\n선생님이 비밀번호를 초기화했을 수 있어요. 로그아웃한 뒤 번호를 눌러 비밀번호를 다시 만들어 주세요."
      : errorMessage(listenError);
    content = (
      <div className="min-h-screen bg-red-50 flex items-center justify-center p-4">
        <div className="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md border border-red-200 text-center">
          <h1 className="text-xl font-bold text-red-600 mb-3">⚠️ 데이터를 불러오지 못했습니다</h1>
          <p className="text-gray-700 mb-5 text-sm whitespace-pre-wrap">{msg}</p>
          <div className="flex gap-2 justify-center">
            <button type="button" onClick={() => window.location.reload()} className="px-4 py-2 bg-emerald-600 text-white rounded-lg font-bold text-sm">새로고침</button>
            <button type="button" onClick={() => logout()} className="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg font-bold text-sm">로그아웃</button>
          </div>
        </div>
      </div>
    );
  } else {
    const connected = netOnline && live;
    const [chipCls, chipText] = SAVE_CHIP[saveStatus];
    const allComplete = isFinal && loaded && subjects.every((s) => semesterStatus(s, exam.sem, sd).complete);
    const selCls = "w-full p-2.5 md:p-3 rounded-lg border border-gray-300 focus:ring-2 outline-none font-bold shadow-sm text-base";
    const doneNos = ALL_NOS.filter((n) => slots[n] && slots[n].uid);
    const notDone = ALL_NOS.filter((n) => !(slots[n] && slots[n].uid));

    const studentPanel = (
      <>
        {isTeacher && !capture && (
          <div className="bg-blue-50 border border-blue-200 p-4 md:p-6 rounded-xl shadow-sm space-y-3">
            <details open className="bg-white rounded-lg border border-blue-100 p-3">
              <summary className="cursor-pointer text-sm md:text-base font-bold text-blue-800">학생 계정 · 명단 관리</summary>
              <div className="mt-3 space-y-3">
                <div className="flex flex-wrap items-center gap-2">
                  <span className="text-sm font-bold text-gray-700">최초 비밀번호 설정:</span>
                  <Chip cls={signupOpen ? "bg-yellow-100 text-yellow-800" : "bg-gray-100 text-gray-600"}>{signupOpen ? "열림 · 학생이 직접 만들 수 있음" : "닫힘"}</Chip>
                  <button type="button" onClick={toggleSignup} className={`px-4 py-1.5 rounded-lg font-bold text-sm text-white ${signupOpen ? "bg-gray-700 hover:bg-gray-800" : "bg-yellow-500 hover:bg-yellow-600"}`}>{signupOpen ? "닫기" : "열기"}</button>
                </div>
                <p className="text-xs text-gray-600 leading-relaxed">
                  비밀번호 설정 완료 <b className="text-emerald-700">{doneNos.length}</b> / {STUDENT_COUNT}명
                  {notDone.length > 0 && <span> · 미설정: {notDone.join(", ")}번</span>}
                </p>
                <button type="button" onClick={editRoster} className="px-4 py-2 rounded-lg border border-blue-200 text-blue-700 font-bold text-sm hover:bg-blue-50">학생 명단 등록/수정</button>
                <p className="text-xs text-gray-500 leading-relaxed">학생이 비밀번호를 잊으면: 아래 '대상 학생'에서 그 학생을 고르고 <b>비밀번호 초기화</b> → 위 스위치 <b>열기</b> → 학생이 새로 만들기 → <b>닫기</b></p>
              </div>
            </details>
            <h2 className="text-blue-800 font-bold text-base md:text-lg flex items-center gap-2 pt-1"><BookOpen className="w-5 h-5" /> 성적 일괄 업로드 (엑셀)</h2>
            <div className="grid md:grid-cols-2 gap-2">
              <button type="button" onClick={downloadTemplate} className="flex items-center justify-center gap-2 bg-white border border-blue-300 text-blue-700 px-4 py-3 rounded-lg font-bold hover:bg-blue-100 text-sm"><Download className="w-5 h-5" /> [{exam.label}] 양식 내려받기</button>
              <button type="button" onClick={() => fileRef.current && fileRef.current.click()} className="flex items-center justify-center gap-2 bg-blue-600 text-white px-4 py-3 rounded-lg font-bold hover:bg-blue-700 shadow-md text-sm"><Upload className="w-5 h-5" /> [{exam.label}] 엑셀 올리기</button>
              <input type="file" accept=".xlsx,.xls,.csv" className="hidden" ref={fileRef} onChange={handleUpload} />
            </div>
            <p className="text-xs text-blue-700 leading-relaxed">첫 열은 번호(또는 '1번 홍길동'), 학기말은 과목별 1차·수행 점수 형식입니다. 저장 전에 확인 창이 뜹니다.</p>
          </div>
        )}

        <div id="capture-area" className="bg-white rounded-2xl shadow-xl overflow-hidden pb-6 md:pb-8" style={capture ? { width: 900 } : undefined}>
          <div className="bg-emerald-600 text-white p-6 md:p-8 text-center">
            <h1 className="text-xl md:text-3xl font-bold mb-2 flex items-center justify-center gap-2"><Award className="w-6 h-6 md:w-8 md:h-8" /> 상정중 3-1 성적 향상 프로젝트 <span className="text-sm md:text-lg text-yellow-300 ml-1 font-black">{VERSION}</span></h1>
            <p className="text-emerald-100 text-xs md:text-lg">"너희들의 빛나는 내일을 아름샘이 항상 응원해! 💪✨"</p>
          </div>
          <div className="p-4 md:p-8 space-y-6 md:space-y-8">
            <section className="bg-gray-50 p-4 md:p-6 rounded-xl border border-gray-200 flex flex-col md:flex-row gap-4 md:gap-6 shadow-inner">
              <div className="flex-1">
                <label className="block text-xs md:text-sm font-bold text-gray-700 mb-1.5">대상 학생</label>
                {isTeacher && !capture ? (
                  <>
                    <div className="flex gap-1.5">
                      <button type="button" onClick={() => setSelectedNo((n) => Math.max(1, n - 1))} className="px-2 rounded-lg border border-gray-300 bg-white"><ChevronL className="w-5 h-5" /></button>
                      <select value={selectedNo} onChange={(e) => setSelectedNo(Number(e.target.value))} className={`${selCls} text-emerald-800 focus:ring-emerald-500`}>
                        {ALL_NOS.map((n) => <option key={n} value={n}>{studentLabel(n)}</option>)}
                      </select>
                      <button type="button" onClick={() => setSelectedNo((n) => Math.min(STUDENT_COUNT, n + 1))} className="px-2 rounded-lg border border-gray-300 bg-white"><ChevronR className="w-5 h-5" /></button>
                      <button type="button" onClick={() => resetStudentPin(selectedNo)} className="px-2 text-[11px] font-bold bg-red-50 text-red-600 rounded-lg border border-red-200 hover:bg-red-100 leading-tight whitespace-nowrap">비밀번호<br/>초기화</button>
                    </div>
                    <p className="mt-1 text-[11px] font-semibold text-gray-500">{slots[selectedNo] && slots[selectedNo].uid ? "✓ 비밀번호 설정 완료" : "아직 비밀번호 미설정"}</p>
                  </>
                ) : <div className="w-full p-2.5 md:p-3 rounded-lg border border-gray-300 bg-white font-bold text-emerald-800">{studentLabel(activeNo)}</div>}
              </div>
              <div className="flex-1">
                <label className="block text-xs md:text-sm font-bold text-gray-700 mb-1.5">분석할 시험</label>
                {!capture ? (
                  <select value={examId} onChange={(e) => setExamId(e.target.value)} className={`${selCls} ${isFinal ? "bg-purple-50 text-purple-800 focus:ring-purple-500" : "text-emerald-800 focus:ring-emerald-500"}`}>
                    {EXAMS.map((e) => <option key={e.id} value={e.id}>{e.label}</option>)}
                  </select>
                ) : <div className="w-full p-2.5 md:p-3 rounded-lg border border-gray-300 bg-white font-bold text-emerald-800">{exam.label}</div>}
              </div>
            </section>

            <section>
              <h2 className={`text-lg md:text-xl font-bold flex items-center gap-2 mb-3 ${isFinal ? "text-purple-800" : "text-emerald-800"}`}><Target className="w-5 h-5 md:w-6 md:h-6" /> {isFinal ? "학기말 성적 결과" : "성적 및 목표 분석"}</h2>
              {!loaded ? (
                <div className="py-12 flex flex-col items-center gap-2 text-emerald-600 font-bold"><Spinner className="w-6 h-6" />{connected ? "불러오는 중..." : "서버 연결을 기다리는 중..."}</div>
              ) : (
                <>
                  <div className={`${capture ? "" : "overflow-x-auto"} rounded-xl border border-gray-200 shadow-sm`}>
                    <table className="w-full text-left border-collapse min-w-[640px] md:min-w-[780px] bg-white">
                      <thead>
                        {isFinal ? (
                          <tr className="bg-purple-50 text-purple-800 border-b-2 border-purple-200 text-xs md:text-sm">
                            <th className="p-2 md:p-3 font-bold text-center">과목</th>
                            <th className="p-2 md:p-3 font-bold text-center whitespace-nowrap"><span className="block text-[10px] font-normal text-purple-600">{exam.sem === 2 ? "1차:수행" : "1차:2차:수행"}</span>반영비율</th>
                            <th className="p-2 md:p-3 font-bold text-center"><span className="block text-[10px] font-normal text-purple-600">{exam.sem === 2 ? "1차 / 수행" : "1차 / 2차 / 수행"}</span>점수</th>
                            <th className="p-2 md:p-3 font-bold text-center bg-purple-100/50">환산총점</th>
                            <th className="p-2 md:p-3 font-bold text-center bg-purple-100/50">성취도</th>
                            {exam.id === "s2f" && <th className="p-2 md:p-3 font-bold text-center bg-purple-100/50">1학기 대비</th>}
                          </tr>
                        ) : (
                          <tr className="bg-emerald-50 text-emerald-800 border-b-2 border-emerald-200 text-xs md:text-sm">
                            <th className="p-2 md:p-3 font-bold text-center">과목</th>
                            <th className="p-2 md:p-3 font-bold text-center">목표</th>
                            <th className="p-2 md:p-3 font-bold text-center">실제</th>
                            <th className="p-2 md:p-3 font-bold text-center">목표 대비</th>
                            <th className="p-2 md:p-3 font-bold text-center">직전 대비</th>
                            <th className="p-2 md:p-3 font-bold text-center">성취도<span className="block text-[10px] font-normal">(참고)</span></th>
                            <th className="p-2 md:p-3 font-bold bg-yellow-100 text-center">다음 등급을 위해<span className="block text-[10px] font-normal">{exam.kind === "e1" ? "필요한 2차 점수" : "필요한 수행 점수"}</span></th>
                          </tr>
                        )}
                      </thead>
                      <tbody>
                        {subjects.map((s) => isFinal
                          ? <SemesterRow key={s.name} sub={s} exam={exam} sd={sd} isTeacher={isTeacher} capture={capture} showDelta={exam.id === "s2f"}
                              onE1={setScore(examIdOf(exam.sem, "e1"), s.name)} onE2={setScore(examIdOf(exam.sem, "e2"), s.name)} onPerf={setPerf(s.name)} />
                          : <ExamRow key={s.name} sub={s} exam={exam} sd={sd} isTeacher={isTeacher} capture={capture}
                              onScore={setScore(examId, s.name)} onTarget={setTarget(s.name)} onExpPerf={setExpPerf(s.name)} />)}
                      </tbody>
                    </table>
                  </div>
                  <div className="mt-2 text-[11px] md:text-xs text-gray-500 space-y-0.5">
                    {isFinal ? <>
                      <p>※ 환산총점 = 각 평가 점수×반영비율의 합. 소수 첫째 자리에서 반올림해 성취도를 정합니다. (괄호 안은 반올림 전)</p>
                      <p>※ 1·2차 점수는 시험 화면과 같은 데이터입니다. 어느 쪽에서 고쳐도 함께 바뀝니다.</p>
                    </> : <>
                      <p>※ 이 화면의 성취도는 이번 시험 점수만으로 본 참고용입니다. 실제 성취도는 학기말 환산총점으로 정해집니다.</p>
                      <p>※ 필요 점수는 0.1점 단위이며, 학기말 반올림 기준(예: 89.5점 → 90점 → A)으로 계산했습니다.</p>
                    </>}
                  </div>
                </>
              )}
            </section>

            {!isFinal && loaded && (
              <section>
                <h2 className="text-lg md:text-xl font-bold text-emerald-800 mb-3 flex items-center gap-2"><PenTool className="w-5 h-5 md:w-6 md:h-6" /> 나의 다짐</h2>
                <ResolutionArea key={`${activeNo}_${examId}`} value={sd[examId]?.plan?.resolution || ""} onSave={saveResolution(activeNo, examId)} capture={capture} />
              </section>
            )}

            {loaded && (
              <section>
                <h2 className="text-lg md:text-xl font-bold text-emerald-800 mb-3 flex items-center gap-2"><BarChart className="w-5 h-5 md:w-6 md:h-6" /> {isTeacher ? "학생 성적 분석" : "내 성적 분석"}</h2>
                <MyAnalysis sd={sd} exam={exam} />
              </section>
            )}

            {allComplete && (
              <div className="bg-emerald-50 p-4 md:p-5 rounded-xl border border-emerald-200 shadow-md">
                <p className="font-bold text-emerald-900 mb-1 flex items-center gap-2 text-sm md:text-base"><Info className="w-4 h-4 md:w-5 md:h-5" /> 아름샘의 한마디:</p>
                {exam.sem === 1
                  ? <p className="text-emerald-800 text-sm md:text-lg">"1학기 동안 정말 고생 많았어! 부족했던 점은 방학 동안 보완하고, 2학기에는 더 높이 날아오를 너희를 기대할게. 화이팅! 🚀"</p>
                  : <p className="text-emerald-800 text-sm md:text-lg">"중학교 3학년, 1년 동안 정말 고생 많았어! 너희들의 새로운 시작과 빛나는 고등학교 생활을 언제나 응원할게. 졸업 축하해! 🎓✨"</p>}
              </div>
            )}
          </div>
        </div>

        {!capture && (
          <div className="pt-2 flex justify-center pb-8">
            <button type="button" onClick={() => downloadImage("capture-area", `${studentLabel(activeNo)}_${exam.label}_분석결과.png`)}
              className={`w-full md:w-auto inline-flex justify-center items-center gap-2 text-white px-8 py-3.5 md:py-4 rounded-full font-bold text-base md:text-lg shadow-lg ${isFinal ? "bg-purple-700 hover:bg-purple-800" : "bg-gray-800 hover:bg-gray-900"}`}>
              <ImageIcon className="w-5 h-5 md:w-6 md:h-6" /> 이 화면을 이미지로 저장하기
            </button>
          </div>
        )}
      </>
    );

    content = (
      <div className="min-h-screen bg-emerald-50 py-6 md:py-8 px-3 md:px-4 text-gray-800">
        <div className="max-w-6xl mx-auto space-y-5">
          {!capture && (
            <div className="bg-white p-3 md:p-4 rounded-xl shadow-sm space-y-2">
              <div className="flex justify-between items-center gap-2">
                <div className="flex items-center gap-2 min-w-0">
                  <div className={`p-2 rounded-lg ${isTeacher ? "bg-blue-100 text-blue-700" : "bg-emerald-100 text-emerald-700"}`}>{isTeacher ? <Users className="w-5 h-5" /> : <User className="w-5 h-5" />}</div>
                  <span className="font-bold text-sm md:text-lg truncate">{isTeacher ? "김아름 선생님 모드" : studentLabel(myNo)}</span>
                </div>
                <div className="flex gap-3 items-center shrink-0">
                  {!isTeacher && <button type="button" onClick={changePassword} className="flex items-center gap-1 text-xs md:text-sm font-semibold text-gray-500 hover:text-blue-600"><Lock className="w-4 h-4" /><span className="hidden md:inline">비밀번호 변경</span></button>}
                  <button type="button" onClick={() => logout()} className="flex items-center gap-1 text-gray-500 hover:text-red-500 font-semibold text-xs md:text-sm"><LogOut className="w-4 h-4" /> 로그아웃</button>
                </div>
              </div>
              <div className="flex flex-wrap gap-1.5">
                <Chip cls={connected ? "bg-emerald-100 text-emerald-700" : "bg-red-100 text-red-700"}>{connected ? "● 실시간 연결됨" : "○ 연결 끊김 · 연결되면 자동 저장"}</Chip>
                <Chip cls={chipCls}>{chipText}</Chip>
                {isTeacher && (selfTest
                  ? <Chip cls={selfTest.ok ? "bg-blue-100 text-blue-700" : "bg-red-600 text-white"}
                      onClick={() => notify(selfTest.ok ? "계산 검증 통과" : "계산 검증 실패", selfTest.ok ? `${selfTest.count.toLocaleString("ko-KR")}가지 경우를 대조해 모두 일치했습니다.` : selfTest.fails.slice(0, 20).join("\n"), selfTest.ok ? "success" : "error")}>
                      {selfTest.ok ? `✓ 계산 검증 통과 (${selfTest.count.toLocaleString("ko-KR")}건)` : `✕ 계산 검증 실패 ${selfTest.fails.length}건`}
                    </Chip>
                  : <Chip cls="bg-gray-100 text-gray-500">계산 검증 중...</Chip>)}
                {isTeacher && signupOpen && <Chip cls="bg-yellow-100 text-yellow-800">⚠ 최초 비밀번호 설정 열림</Chip>}
              </div>
            </div>
          )}

          {isTeacher && !capture && (
            <div className="flex gap-2 bg-white p-1.5 rounded-xl shadow-sm">
              {[["student", "학생별 입력·분석", User], ["stats", "반 통계·그래프", BarChart]].map(([k, l, Ic]) => (
                <button key={k} type="button" onClick={() => setTab(k)} className={`flex-1 py-2.5 rounded-lg font-bold text-sm flex items-center justify-center gap-1.5 ${tab === k ? "bg-emerald-600 text-white" : "text-gray-600 hover:bg-gray-50"}`}><Ic className="w-4 h-4" />{l}</button>
              ))}
            </div>
          )}

          {isTeacher && tab === "stats"
            ? (loaded
                ? <StatsView dataByNo={dataByNo} roster={roster} capture={capture} notify={notify}
                    onPickStudent={(no, id) => { setSelectedNo(no); setExamId(id); setTab("student"); window.scrollTo(0, 0); }}
                    onCapture={(lbl) => downloadImage("stats-area", `반통계_${lbl}.png`)} />
                : <div className="py-16 flex flex-col items-center gap-2 text-emerald-600 font-bold"><Spinner />서버 연결을 기다리는 중...</div>)
            : studentPanel}
        </div>
      </div>
    );
  }

  return (
    <>
      {content}
      <Modal key={modal ? modal.id : "none"} cfg={modal} onClose={(id) => setModal((m) => (m && m.id === id ? null : m))} />
      {busy && <div className="fixed inset-0 bg-white/70 backdrop-blur-sm flex flex-col items-center justify-center z-[250] text-emerald-600"><Spinner className="w-12 h-12 mb-3" /><span className="text-xl font-bold text-emerald-800">{busy}</span></div>}
    </>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
