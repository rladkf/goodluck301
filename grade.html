const EXAMS = [
  { id: "s1e1", label: "3학년 1학기 1차시험", short: "1학기 1차", sem: 1, kind: "e1" },
  { id: "s1e2", label: "3학년 1학기 2차시험", short: "1학기 2차", sem: 1, kind: "e2" },

  { id: "s2e1", label: "3학년 2학기 1차시험", short: "2학기 1차", sem: 2, kind: "e1" },

];
const examById = Object.fromEntries(EXAMS.map((e) => [e.id, e]));
const examIdOf = (sem, kind) => `s${sem}${kind === "final" ? "f" : kind}`;
const SEQ = { e: ["s1e1", "s1e2", "s2e1"], f: ["s1f", "s2f"] };   // 직전 비교 순서

// r1: 1차 반영비율(%), r2: 2차 반영비율(%), rp: 수행 만점(=반영비율)
const SUBJECTS = {
  1: [
    { name: "국어", r1: 30, r2: 30, rp: 40 }, { name: "수학", r1: 25, r2: 25, rp: 50 },
    { name: "영어", r1: 30, r2: 30, rp: 40 }, { name: "과학", r1: 30, r2: 30, rp: 40 },
    { name: "사회", r1: 0,  r2: 70, rp: 30 }, { name: "역사", r1: 0,  r2: 40, rp: 60 },
    { name: "도덕", r1: 0,  r2: 60, rp: 40 }, { name: "체육", r1: 0,  r2: 0,  rp: 100 },
    { name: "미술", r1: 0,  r2: 0,  rp: 100 },
  ],
  2: [
    { name: "국어", r1: 50, r2: 0, rp: 50 }, { name: "수학", r1: 50, r2: 0, rp: 50 },
    { name: "과학", r1: 50, r2: 0, rp: 50 },
    { name: "사회", r1: 70, r2: 0, rp: 30 }, { name: "역사", r1: 40, r2: 0, rp: 60 },
    { name: "도덕", r1: 60, r2: 0, rp: 40 }, { name: "체육", r1: 0, r2: 0, rp: 100 },
    { name: "미술", r1: 0,  r2: 0,  rp: 100 },
  ],
};
const subOf = (sem, name) => SUBJECTS[sem].find((s) => s.name === name) || null;
const SUBJECT_COLORS = { 국어: "#ef4444", 수학: "#3b82f6", 영어: "#10b981", 과학: "#8b5cf6", 사회: "#f59e0b", 역사: "#a16207", 도덕: "#ec4899", 체육: "#14b8a6", 미술: "#64748b" };
const GRADE_COLORS = { A: "#3b82f6", B: "#10b981", C: "#eab308", D: "#f97316", E: "#ef4444" };

/* ═════════════════════════ 2. 정확한 계산 (정수 연산) ═════════════════════════
   모든 점수는 0.1점 단위 정수(S)로 바꿔 계산합니다. 예: 87.5점 → 875
   학기말 총점은 1/1000점 단위 정수(U)로 계산 후 소수 첫째 자리에서 반올림합니다.
   (점수가 소수 둘째 자리까지 있는 학교라면 SCALE=100, DEC=2 로 바꾸면 됩니다.)    */
const SCALE = 10;
const DEC = 1;
const UNIT = SCALE * 100;

const isNum = (v) => v !== "" && v !== null && v !== undefined && Number.isFinite(Number(v));
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const ensure = (o, k) => (o[k] = o[k] || {});
const toS = (v) => (isNum(v) ? Math.round(Number(v) * SCALE) : null);
const ceilDiv = (a, b) => Math.floor((a + b - 1) / b);                       // a ≥ 0, b > 0
const roundDiv = (a, b) => (a < 0 ? -1 : 1) * Math.floor((2 * Math.abs(a) + b) / (2 * b));  // 반올림
const fmtScaled = (n, dec) => {                                               // 정수 → 소수 문자열 (오차 없음)
  const neg = n < 0, a = Math.abs(n), p = 10 ** dec;
  const ip = Math.floor(a / p), fp = a % p;
  let s = String(ip);
  if (fp) s += "." + String(fp).padStart(dec, "0").replace(/0+$/, "");
  return (neg ? "-" : "") + s;
};
const fmtS = (s) => fmtScaled(s, DEC);

const THREE_LEVEL = new Set(["체육", "미술"]);
const cutsFor = (subj) => (THREE_LEVEL.has(subj) ? [["A", 80], ["B", 60]] : [["A", 90], ["B", 80], ["C", 70], ["D", 60]]);
const lowestGrade = (subj) => (THREE_LEVEL.has(subj) ? "C" : "E");
const gradesFor = (subj) => [...cutsFor(subj).map((c) => c[0]), lowestGrade(subj)];
const gradeOfS = (s, subj) => { for (const [g, cut] of cutsFor(subj)) if (s >= cut * SCALE) return g; return lowestGrade(subj); };
const gradeOfPoints = (p, subj) => gradeOfS(p * SCALE, subj);

// 학기말 환산총점(U, 1/UNIT점) = 1차×r1% + 2차×r2% + 수행
const semTotalU = (sub, e1, e2, perf) =>
  (sub.r1 ? clamp(e1 || 0, 0, 100 * SCALE) * sub.r1 : 0) +
  (sub.r2 ? clamp(e2 || 0, 0, 100 * SCALE) * sub.r2 : 0) +
  (sub.rp ? clamp(perf || 0, 0, sub.rp * SCALE) * 100 : 0);
const pointsOf = (U) => Math.floor((U + UNIT / 2) / UNIT);                    // 반올림 → 정수점

// 학기말 상태: 1·2차는 시험 화면 점수(단일 출처), 수행은 학기말 문서
const semesterStatus = (sub, sem, sd) => {
  const e1 = toS(sd?.[examIdOf(sem, "e1")]?.scores?.[sub.name]);
  const e2 = toS(sd?.[examIdOf(sem, "e2")]?.scores?.[sub.name]);
  const perf = toS(sd?.[examIdOf(sem, "final")]?.perf?.[sub.name]);
  const parts = [[sub.r1, e1], [sub.r2, e2], [sub.rp, perf]];
  const complete = parts.every(([r, v]) => r === 0 || v !== null);
  const any = parts.some(([r, v]) => r > 0 && v !== null);
  const U = semTotalU(sub, e1, e2, perf);
  const points = pointsOf(U);
  return { e1, e2, perf, complete, any, U, points, grade: complete ? gradeOfPoints(points, sub.name) : null };
};

// 남은 항목 X(0.1점 단위)에서 등급별로 필요한 구간. knownU: 확정된 부분, coef: X 1단위당 총점 기여(U)
const project = (subj, knownU, coef, maxS) => {
  const rows = [];
  let hi = maxS;
  for (const [g, cut] of cutsFor(subj)) {
    const rem = cut * UNIT - UNIT / 2 - knownU;          // 반올림해서 cut 이 되는 최소 총점까지 남은 양
    const lo = rem <= 0 ? 0 : ceilDiv(rem, coef);
    if (lo > hi) continue;                                // 도달 불가
    rows.push({ grade: g, lo, hi });
    if (lo === 0) break;                                  // 이 등급 이상 확정
    hi = lo - 1;
  }
  return rows;
};
// 화면과 자동 검증이 함께 쓰는 '필요 점수' 계산
const projectionFor = (mode, sub, e1S, e2S, expPerf) => {
  if (mode === "e1") {
    if (!sub.r1) return { msg: "1차 미실시" };
    if (e1S === null) return { msg: "1차 점수 입력 필요" };
    if (sub.r2) return { label: "2차", maxS: 100 * SCALE, rows: project(sub.name, e1S * sub.r1 + clamp(expPerf, 0, sub.rp) * SCALE * 100, sub.r2, 100 * SCALE) };
    return { label: "수행", maxS: sub.rp * SCALE, rows: project(sub.name, e1S * sub.r1, 100, sub.rp * SCALE) };
  }
  if (!sub.r2) return { msg: "-" };
  if (sub.r1 && e1S === null) return { msg: "1차 점수 입력 필요" };
  if (e2S === null) return { msg: "2차 점수 입력 필요" };
  return { label: "수행", maxS: sub.rp * SCALE, rows: project(sub.name, (sub.r1 ? e1S * sub.r1 : 0) + e2S * sub.r2, 100, sub.rp * SCALE) };
};

/* ═════════════════════════ 3. 비교·통계 ═════════════════════════ */
const takes = (examId, name) => {
  const e = examById[examId], s = subOf(e.sem, name);
  return !!s && (e.kind === "final" || (e.kind === "e1" ? s.r1 : s.r2) > 0);
};
const examSubjects = (exam) => SUBJECTS[exam.sem].filter((s) => takes(exam.id, s.name));
const prevExamFor = (examId, name) => {
  const seq = examById[examId].kind === "final" ? SEQ.f : SEQ.e;
  for (let i = seq.indexOf(examId) - 1; i >= 0; i--) if (takes(seq[i], name)) return seq[i];
  return null;
};
// 한 학생·시험·과목 점수(S). 학기말은 모든 항목이 입력된 환산총점(정수점)만
const valueS = (sd, examId, name) => {
  if (!takes(examId, name)) return null;
  const e = examById[examId];
  if (e.kind !== "final") return toS(sd?.[examId]?.scores?.[name]);
  const st = semesterStatus(subOf(e.sem, name), e.sem, sd);
  return st.complete ? st.points * SCALE : null;
};
const deltaInfo = (sd, examId, name) => {
  const prevExam = prevExamFor(examId, name);
  if (!prevExam) return { prevExam: null, prev: null, delta: null };
  const cur = valueS(sd, examId, name), prev = valueS(sd, prevExam, name);
  return { prevExam, prev, delta: cur !== null && prev !== null ? cur - prev : null };
};
const studentSummary = (sd, examId) => {
  const subs = examSubjects(examById[examId]);
  const vals = {}, prevs = {}, deltas = {};
  let sum = 0, n = 0, dsum = 0, dn = 0;
  for (const s of subs) {
    const v = valueS(sd, examId, s.name), d = deltaInfo(sd, examId, s.name);
    vals[s.name] = v; prevs[s.name] = d.prev; deltas[s.name] = d.delta;
    if (v !== null) { sum += v; n++; }
    if (d.delta !== null) { dsum += d.delta; dn++; }
  }
  return { vals, prevs, deltas, sum, n, dsum, dn, total: subs.length,
    avgX: n ? roundDiv(sum * 10, n) : null,          // X 단위 = 0.01점 (SCALE=10일 때)
    avgDeltaX: dn ? roundDiv(dsum * 10, dn) : null };
};
const fmtX = (x) => fmtScaled(x, DEC + 1);
const xToPt = (x) => (x === null ? null : x / (SCALE * 10));
const subjectStats = (dataByNo, examId, sub) => {
  const vals = ALL_NOS.map((no) => valueS(dataByNo[no], examId, sub.name)).filter((v) => v !== null).sort((a, b) => a - b);
  const prevExam = prevExamFor(examId, sub.name);
  const pv = prevExam ? ALL_NOS.map((no) => valueS(dataByNo[no], prevExam, sub.name)).filter((v) => v !== null) : [];
  const n = vals.length, pn = pv.length;
  const sum = vals.reduce((a, b) => a + b, 0), psum = pv.reduce((a, b) => a + b, 0);
  const dist = {};
  gradesFor(sub.name).forEach((g) => { dist[g] = 0; });
  vals.forEach((v) => { dist[gradeOfS(v, sub.name)]++; });
  return {
    n, prevExam, dist,
    meanX: n ? roundDiv(sum * 10, n) : null,
    prevMeanX: pn ? roundDiv(psum * 10, pn) : null,
    changeX: n && pn ? roundDiv(sum * 10 * pn - psum * 10 * n, n * pn) : null,
    medianX: n ? (n % 2 ? vals[(n - 1) / 2] * 10 : (vals[n / 2 - 1] + vals[n / 2]) * 5) : null,
    max: n ? vals[n - 1] : null, min: n ? vals[0] : null,
    sd: n ? Math.sqrt(vals.reduce((a, v) => a + (v - sum / n) ** 2, 0) / n) / SCALE : null,
  };
};
const cmpFrac = (x, y) => x.num * y.den - y.num * x.den;
const nonEmpty = (m) => !!m && Object.keys(m).length > 0;
const hasData = (d) => !!d && (nonEmpty(d.scores) || nonEmpty(d.perf) || nonEmpty(d.plan?.targets) || !!d.plan?.resolution);

/* ═════════════════════════ 4. 계산 자동 검증 ═════════════════════════ */
const runSelfTests = () => {
  const fails = [];
  let count = 0;
  const eq = (name, got, exp) => { count++; if (got !== exp) fails.push(`${name}: ${got} ≠ ${exp}`); };

  // (1) 학기말 고정 사례
  [
    [1, "국어", 85, 88, 36, "87.9", 88, "B"],
    [1, "국어", 85, 80, 40, "89.5", 90, "A"],
    [1, "국어", 85, 79.9, 40, "89.47", 89, "B"],
    [1, "수학", 90, 90, 45, "90", 90, "A"],
    [1, "사회", null, 85.5, 25, "84.85", 85, "B"],
    [1, "역사", null, 100, 60, "100", 100, "A"],
    [1, "체육", null, null, 79.5, "79.5", 80, "A"],
    [1, "체육", null, null, 59.4, "59.4", 59, "C"],
    [2, "사회", 77.7, null, 30, "84.39", 84, "B"],
    [1, "국어", 0, 0, 0, "0", 0, "E"],
  ].forEach(([sem, name, e1, e2, perf, raw, pts, g], i) => {
    const sub = subOf(sem, name);
    const U = semTotalU(sub, toS(e1), toS(e2), toS(perf));
    eq(`학기말${i}-원점수`, fmtScaled(U, DEC + 2), raw);
    eq(`학기말${i}-반올림`, pointsOf(U), pts);
    eq(`학기말${i}-성취도`, gradeOfPoints(pointsOf(U), name), g);
  });

  // (2) 반올림 경계 전수 검사
  for (let U = 0; U <= 100 * UNIT; U++) {
    const ref = Math.floor(U / UNIT) + ((U % UNIT) >= UNIT / 2 ? 1 : 0);
    count++;
    if (pointsOf(U) !== ref) { fails.push(`반올림 U=${U}`); break; }
  }

  // (3) 표시·보조 함수
  eq("fmt1", fmtScaled(875, 1), "87.5"); eq("fmt2", fmtScaled(-25, 1), "-2.5");
  eq("fmt3", fmtScaled(0, 1), "0"); eq("fmt4", fmtScaled(1000, 1), "100"); eq("fmt5", fmtScaled(8505, 2), "85.05");
  eq("rd1", roundDiv(5, 2), 3); eq("rd2", roundDiv(-5, 2), -3); eq("rd3", roundDiv(7, 3), 2);
  eq("toS1", toS(87.3), 873); eq("toS2", toS(0.1 + 0.2), 3);

  // (4) 직전 대비·평균
  const mock = { s1e1: { scores: { 국어: 85 } }, s1e2: { scores: { 국어: 88.5, 사회: 70 } }, s2e1: { scores: { 국어: 80, 사회: 75.5 } } };
  eq("변화1", deltaInfo(mock, "s1e2", "국어").delta, 35);
  eq("변화2", deltaInfo(mock, "s1e2", "사회").delta, null);
  eq("변화3", deltaInfo(mock, "s2e1", "사회").delta, 55);
  eq("변화4", deltaInfo(mock, "s2e1", "국어").delta, -85);
  eq("평균1", fmtX(studentSummary(mock, "s2e1").avgX), "77.75");
  const mockF = { s1e1: { scores: { 국어: 85 } }, s1e2: { scores: { 국어: 80 } }, s1f: { perf: { 국어: 40 } } };
  eq("학기말값", valueS(mockF, "s1f", "국어"), 900);

  // (5) '다음 등급' 안내 ↔ 실제 학기말 계산 전수 대조 (0.1점 단위)
  const brute = (tag, sub, proj, totalAt) => {
    const order = gradesFor(sub.name);
    for (let x = 0; x <= proj.maxS; x++) {
      count++;
      const actual = gradeOfPoints(pointsOf(totalAt(x)), sub.name);
      const row = proj.rows.find((r) => x >= r.lo && x <= r.hi);
      const last = proj.rows[proj.rows.length - 1];
      const ok = row ? row.grade === actual
        : last ? order.indexOf(actual) > order.indexOf(last.grade) : actual === lowestGrade(sub.name);
      if (!ok) { fails.push(`${tag} x=${fmtS(x)} 안내≠실제(${actual})`); return; }
    }
  };
  for (const sem of [1, 2]) {
    for (const sub of SUBJECTS[sem]) {
      if (sub.r1) {
        for (const e1 of [0, 55.5, 77.7, 85, 99.9, 100]) {
          for (const perf of [0, Math.floor(sub.rp / 2), sub.rp - 1, sub.rp]) {
            const p = projectionFor("e1", sub, toS(e1), null, perf);
            if (p.rows) brute(`${sem}학기 ${sub.name} 1차${e1}/수행${perf}`, sub, p,
              (x) => sub.r2 ? semTotalU(sub, toS(e1), x, perf * SCALE) : semTotalU(sub, toS(e1), 0, x));
          }
        }
      }
      if (sub.r2) {
        for (const e1 of sub.r1 ? [0, 66.6, 85, 100] : [null]) {
          for (const e2 of [0, 70.3, 89.9, 100]) {
            const p = projectionFor("e2", sub, toS(e1), toS(e2), 0);
            if (p.rows) brute(`${sem}학기 ${sub.name} 1차${e1}/2차${e2}`, sub, p, (x) => semTotalU(sub, toS(e1), toS(e2), x));
          }
        }
      }
    }
  }
  return { ok: fails.length === 0, count, fails };
};

};

const LIBS = {
  chart: { url: "https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js", test: () => window.Chart,
           init: () => { window.Chart.defaults.font.family = "'Pretendard','Malgun Gothic',sans-serif"; } },
  xlsx: { url: "https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js", test: () => window.XLSX },
  h2c: { url: "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js", test: () => window.html2canvas },
};
const libPromises = {};
const loadLib = (name) => {
  const lib = LIBS[name];
  if (lib.test()) return Promise.resolve();
  if (!libPromises[name]) {
    libPromises[name] = new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = lib.url; s.async = true;
      s.onload = () => { if (lib.test()) { if (lib.init) lib.init(); res(); } else rej(new Error("load")); };
      s.onerror = () => { delete libPromises[name]; rej(new Error("load")); };
      document.head.appendChild(s);
    });
  }
  return libPromises[name];
};
const useLib = (name) => {
  const [state, setState] = useState(LIBS[name].test() ? "ready" : "loading");
  useEffect(() => {
    if (state === "ready") return;
    loadLib(name).then(() => setState("ready")).catch(() => setState("failed"));
  }, []);
  return state;
};

const NumInput = ({ s, max = 100, disabled, onCommit, placeholder, capture, tone = "" }) => {
  const shown = s === null || s === undefined ? "" : fmtS(s);
  const [text, setText] = useState(shown);
  const editing = useRef(false);
  useEffect(() => { if (!editing.current) setText(shown); }, [shown]);
  if (capture) return <div className={`w-14 px-1 py-1 text-center font-bold text-sm ${tone}`}>{shown === "" ? "-" : shown}</div>;
  const commit = () => {
    editing.current = false;
    const t = text.trim();
    if (t === "" || t === ".") { setText(""); if (shown !== "") onCommit(null); return; }
    const n = Number(t);
    if (!Number.isFinite(n)) { setText(shown); return; }
    const ns = clamp(Math.round(n * SCALE), 0, max * SCALE);
    setText(fmtS(ns));
    if (ns !== s) onCommit(ns / SCALE);
  };
  return (
    <input type="text" inputMode="decimal" autoComplete="off" disabled={disabled} value={text} placeholder={placeholder}
      onFocus={() => { editing.current = true; }}
      onChange={(e) => {
        const v = e.target.value.replace(/[^0-9.]/g, "");
        const [i, ...rest] = v.split(".");
        setText(rest.length ? `${i}.${rest.join("").slice(0, DEC)}` : i);
      }}
      onBlur={commit}
      onKeyDown={(e) => { if (e.key === "Enter") e.currentTarget.blur(); }}
      className={`w-14 px-1 py-1 text-center border rounded font-bold outline-none text-base md:text-sm shadow-sm focus:ring-2 focus:ring-emerald-400 ${disabled ? "bg-gray-100 text-gray-500 cursor-not-allowed" : "bg-white"} ${tone}`} />
  );
};

const Modal = ({ cfg, onClose }) => {
  const [vals, setVals] = useState(() => Object.fromEntries(((cfg && cfg.fields) || []).map((f) => [f.key, f.initial || ""])));
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(false);
  if (!cfg) return null;
  const [icon, titleCls, borderCls] = TONE[cfg.tone || "info"];
  const confirm = async () => {
    if (loading) return;
    if (!cfg.onConfirm) return onClose(cfg.id);
    setErr(""); setLoading(true);
    try {
      const r = await cfg.onConfirm(vals);
      if (typeof r === "string") { setErr(r); setLoading(false); return; }
      onClose(cfg.id);
    } catch (e) { console.error(e); setErr(errorMessage(e)); setLoading(false); }
  };
  const inputCls = "w-full p-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 font-bold text-gray-800 text-base md:text-sm";
  return (
    <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-[300] p-4">
      <div className={`bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md border-t-8 ${borderCls} max-h-[90vh] overflow-y-auto`}>
        <h3 className={`text-lg font-bold mb-3 flex items-center gap-2 ${titleCls}`}>{icon} {cfg.title}</h3>
        {cfg.message && <p className="text-gray-700 mb-4 font-semibold leading-relaxed whitespace-pre-wrap text-sm">{cfg.message}</p>}
        {(cfg.fields || []).map((f, i) => (
          <label key={f.key} className="block mb-3">
            <span className="block text-xs font-bold text-gray-600 mb-1">{f.label}</span>
            {f.type === "textarea"
              ? <textarea rows={10} value={vals[f.key]} onChange={(e) => setVals((v) => ({ ...v, [f.key]: e.target.value }))} className={inputCls} />
              : <input type={f.type || "text"} inputMode={f.inputMode} maxLength={f.maxLength} autoFocus={i === 0} value={vals[f.key]}
                  onChange={(e) => setVals((v) => ({ ...v, [f.key]: f.digits ? e.target.value.replace(/\D/g, "") : e.target.value }))}
                  onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); confirm(); } }} className={inputCls} />}
          </label>
        ))}
        {err && <p className="text-red-500 font-bold text-xs mb-3 whitespace-pre-wrap">{err}</p>}
        <div className="flex justify-end gap-2">
          {cfg.cancel && <button type="button" disabled={loading} onClick={() => onClose(cfg.id)} className="px-4 py-2 text-gray-600 font-bold hover:bg-gray-100 rounded-lg text-sm">취소</button>}
          <button type="button" disabled={loading} onClick={confirm} className={`px-5 py-2 ${cfg.tone === "danger" ? "bg-red-600 hover:bg-red-700" : "bg-emerald-600 hover:bg-emerald-700"} text-white font-bold rounded-lg shadow-md text-sm disabled:opacity-60`}>
            {loading ? "처리 중..." : (cfg.confirmText || "확인")}
          </button>
        </div>
      </div>
    </div>
  );
};
